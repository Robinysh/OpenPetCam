<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#F6F8FF">
<link rel="stylesheet" href="/themes.css">
<script>/* the chosen theme before first paint; theme-app.js resolves the rest */try{var p=JSON.parse(localStorage.getItem("openpetcam.theme.preferences.v1")||"{}"),d=document.documentElement;d.setAttribute("data-opc-theme",{cobalt:1,golden:1,meadow:1}[p.theme]?p.theme:"cobalt");if(p.appearance==="light"||p.appearance==="dark")d.setAttribute("data-opc-mode",p.appearance)}catch(e){}</script>
<script type="module" src="/theme-app.js"></script>
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="icon" href="/favicon.png" sizes="96x96" type="image/png">
<meta name="apple-mobile-web-app-title" content="{{APP_NAME}}">
<title>{{APP_NAME}} · Agent</title>
<style>
  :root { --bg:var(--opc-canvas); --card:var(--opc-surface); --card2:var(--opc-surface-raised); --line:var(--opc-border-subtle); --control:var(--opc-control-border); --text:var(--opc-text-primary); --muted:var(--opc-text-secondary); --dim:var(--opc-text-muted); --accent:var(--opc-accent-fill); --on-accent:var(--opc-on-accent); --accent-fg:var(--opc-accent-foreground); --accent-subtle:var(--opc-accent-subtle); --ok:var(--opc-success); --warn:var(--opc-warning); --bad:var(--opc-error); }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--text); font:15px/1.4 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
  main { max-width:720px; margin:0 auto; padding:calc(env(safe-area-inset-top) + 14px) 16px calc(env(safe-area-inset-bottom) + 30px); }
  .embed main { padding-bottom:24px; }
  header { display:flex; justify-content:space-between; align-items:center; gap:10px; }
  h1 { margin:0; font-size:28px; font-weight:800; letter-spacing:-.02em; }
  h2 { font-size:13px; font-weight:700; color:var(--muted); text-transform:uppercase; letter-spacing:.06em; margin:22px 0 8px; }
  a { color:var(--accent-fg); }
  .chip { display:inline-flex; align-items:center; gap:6px; padding:5px 10px; border-radius:12px; background:var(--card2); font-size:12px; font-weight:700; }
  .chip i { width:8px; height:8px; border-radius:4px; background:var(--dim); }
  .chip.ok i { background:var(--ok); } .chip.warn i { background:var(--warn); } .chip.bad i { background:var(--bad); }
  .north { color:var(--muted); font-size:13px; margin:8px 0 0; }
  .list { display:flex; flex-direction:column; gap:8px; }
  .item { background:var(--card); border:1px solid var(--line); border-radius:16px; padding:11px 13px; }
  .item .t { display:flex; justify-content:space-between; gap:8px; font-weight:700; font-size:14px; }
  .item .t span { color:var(--dim); font-weight:600; font-size:12px; white-space:nowrap; }
  .item .s { color:var(--muted); font-size:13px; margin-top:3px; overflow-wrap:anywhere; }
  .run { display:inline-block; width:8px; height:8px; border-radius:4px; background:var(--accent); margin-right:6px; }
  @keyframes p { 50% { opacity:.25; } }
  .feed .item { padding:9px 12px; }
  .k { font-size:11px; font-weight:800; text-transform:uppercase; letter-spacing:.04em; color:var(--dim); }
  .k.result { color:var(--ok); } .k.ask, .k.alert { color:var(--warn); } .k.error { color:var(--bad); } .k.dispatch { color:var(--accent-fg); }
  pre { white-space:pre-wrap; font:13px/1.45 ui-monospace, SFMono-Regular, Menlo, monospace; background:var(--card); border:1px solid var(--line);
        border-radius:14px; padding:12px; color:var(--muted); margin:0; }
  .empty { color:var(--dim); font-size:13px; padding:8px 2px; }
</style>
</head>
<body>
<main>
  <header>
    <div><h1>Agent activity</h1><div class="north" id="north"></div></div>
    <span class="chip" id="alive"><i></i><span>…</span></span>
  </header>

  <p class="north"><a href="/?monitoring=goals" id="open-monitoring">Monitoring: goals and watched behavior →</a></p>

  <h2>Recorded work</h2>
  <div class="list" id="ongoing"></div>

  <h2>Recent decisions</h2>
  <div class="list feed" id="feed"></div>

  <h2>Your steering</h2>
  <pre id="steer">…</pre>
  <p class="north">To steer: tell Claude Code in your chat. It edits this list, the goals and the policies, and the agent reads them every turn.
    <a href="/" id="back">Back to the camera</a></p>
</main>
<script>
"use strict";
const $ = (id) => document.getElementById(id);
const ago = (ts) => { const s = Date.now() / 1000 - ts; return s < 90 ? "just now" : s < 3600 ? `${Math.round(s / 60)} min ago` : s < 86400 ? `${Math.round(s / 3600)} h ago` : `${Math.round(s / 86400)} d ago`; };
const NAMES = { reports_answered: "Reports answered", owner_reports: "Owner reports / day", search_success: "Find success",
  cpu: "CPU (% of a core)", burst_credits: "CPU credits", qa: "QA failures", app_status_fresh: "App freshness (s)",
  video_start: "Video start (s, median)", fix_queue: "Oldest queued fix (h)", find_time: "Find time (s, median)",
  follow_retention: "Follow visibility (%)" };
function el(tag, cls, html) { const e = document.createElement(tag); if (cls) e.className = cls; if (html !== undefined) e.innerHTML = html; return e; }
function text(s) { const d = document.createElement("div"); d.textContent = s == null ? "" : String(s); return d.innerHTML; }
const selectedThread = new URLSearchParams(location.search).get("thread");
async function load() {
  let d;
  try { const r = await fetch("/api/agent" + (selectedThread ? "?thread=" + encodeURIComponent(selectedThread) : ""), { credentials: "same-origin" }); if (r.status === 401) { top.location.href = "/login"; return; } d = await r.json(); }
  catch (e) { $("alive").querySelector("span").textContent = "Server unreachable"; return; }
  const beats = Object.fromEntries((d.beats || []).map((b) => [b.name, b]));
  const tick = beats.tick, wd = beats.watchdog;
  const age = tick ? d.now - tick.ts : 1e9;
  const probs = wd && wd.detail ? (JSON.parse(wd.detail).problems || []) : [];
  const chip = $("alive");
  chip.className = `chip ${age < 600 && !probs.length ? "ok" : age < 3600 ? "warn" : "bad"}`;
  chip.querySelector("span").textContent = age < 600 ? (probs.length ? `Running · ${probs.length} issue${probs.length > 1 ? "s" : ""}` : "Running") : tick ? `Paused · last ${ago(tick.ts)}` : "Not started";
  chip.title = probs.join("; ");
  $("north").textContent = d.north || "";
  const on = $("ongoing"); on.innerHTML = "";
  const open = selectedThread ? (d.selected_thread ? [d.selected_thread] : []) : d.threads.filter((t) => t.status !== "closed" && !["router", "steer"].includes(t.id));
  if (!open.length) on.appendChild(el("div", "empty", "Nothing open."));
  for (const t of open) {
    const running = (t.worker || "").startsWith("pid:");
    const c = el("div", "item");
    c.innerHTML = `<div class="t"><span>${running ? '<i class="run"></i>' : ""}${text(t.id.startsWith("goal:") ? NAMES[t.id.slice(5)] || t.title : t.title || t.id)}</span><span>${ago(t.updated)}</span></div>
      <div class="s">${running ? `Worker assigned (${text(t.kind || "worker")}). ` : ""}${text(t.summary || "")}</div>`;
    on.appendChild(c);
  }
  const f = $("feed"); f.innerHTML = "";
  const decisions = selectedThread ? (d.selected_thread?.log || []) : d.log;
  for (const l of decisions.slice(0, 40)) {
    const c = el("div", "item");
    c.innerHTML = `<div class="t"><span><span class="k ${text(l.kind)}">${text(l.kind)}</span> · ${text(l.actor)}${l.thread ? ` · ${text(l.thread)}` : ""}</span><span>${ago(l.ts)}</span></div>
      <div class="s">${text(l.text)}</div>`;
    f.appendChild(c);
  }
  if (!decisions.length) f.appendChild(el("div", "empty", "No decisions yet."));
  $("steer").textContent = d.steer || "(none yet)";
}
if (selectedThread?.startsWith("goal:")) $("open-monitoring").href = "/?monitoring=goals&goal=" + encodeURIComponent(selectedThread.slice(5));
$("open-monitoring").onclick = (event) => {
  if (window.parent === window) return;
  event.preventDefault();
  const goal = selectedThread?.startsWith("goal:") ? selectedThread.slice(5) : undefined;
  window.parent.postMessage({ type: "openpetcam-monitoring", goal }, location.origin);
};
// Inside the app's Agent tab: the tab bar is the way back, and the top safe area belongs to the frame.
if (new URLSearchParams(location.search).has("embed")) { $("back").remove(); document.documentElement.classList.add("embed"); }
load(); setInterval(load, 20000);
</script>
</body>
</html>
