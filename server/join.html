<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#F6F8FF">
<link rel="stylesheet" href="/themes.css">
<script>/* the chosen theme before first paint; theme-app.js resolves the rest */try{var p=JSON.parse(localStorage.getItem("openpetcam.theme.preferences.v1")||"{}"),d=document.documentElement;d.setAttribute("data-opc-theme",{cobalt:1,golden:1,meadow:1}[p.theme]?p.theme:"cobalt");if(p.appearance==="light"||p.appearance==="dark")d.setAttribute("data-opc-mode",p.appearance)}catch(e){}</script>
<script type="module" src="/theme-app.js"></script>
<meta name="robots" content="noindex">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="icon" href="/favicon.png" sizes="96x96" type="image/png">
<meta name="apple-mobile-web-app-title" content="{{APP_NAME}}">
<title>Join {{APP_NAME}}</title>
<style>
  :root { --bg:var(--opc-canvas); --card:var(--opc-surface); --card2:var(--opc-surface-raised); --line:var(--opc-border-subtle); --control:var(--opc-control-border); --text:var(--opc-text-primary); --muted:var(--opc-text-secondary); --dim:var(--opc-text-muted); --accent:var(--opc-accent-fill); --on-accent:var(--opc-on-accent); --accent-fg:var(--opc-accent-foreground); --accent-subtle:var(--opc-accent-subtle); --ok:var(--opc-success); --warn:var(--opc-warning); --bad:var(--opc-error); }
  * { box-sizing: border-box; }
  body { margin:0; min-height:100dvh; display:grid; place-items:center; background:var(--bg); color:var(--text);
         font:16px/1.4 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; padding:16px; }
  .card { width:100%; max-width:360px; background:var(--card); border:1px solid var(--line); border-radius:22px; padding:28px 22px; text-align:center; }
  .logo { width:72px; height:72px; border-radius:18px; margin:0 auto 16px; display:block; }
  h1 { margin:0 0 8px; font-size:24px; }
  p { margin:0 0 22px; color:var(--muted); font-size:15px; }
  button { width:100%; padding:15px; border:0; border-radius:14px; background:var(--accent); color:var(--on-accent); font-size:17px; font-weight:700; cursor:pointer; }
  .expired, .ok { display:none; }
  [data-state="ok"] .ok, [data-state="expired"] .expired { display:block; }

  /* the mark for light surfaces, and the light-ringed one for dark (follows the theme's mode) */
  .logo.on-dark { display:none; }
  @media (prefers-color-scheme: dark) { :root:not([data-opc-mode]) .logo.on-light { display:none; } :root:not([data-opc-mode]) .logo.on-dark { display:block; } }
  :root[data-opc-mode="dark"] .logo.on-light { display:none; } :root[data-opc-mode="dark"] .logo.on-dark { display:block; }
</style>
</head>
<body data-state="{{STATE}}">
<div class="card">
  <img class="logo on-light" src="/logo-light.png" alt="OpenPetCam"><img class="logo on-dark" src="/logo.png" alt="OpenPetCam">
  <div class="ok">
    <h1>Hi {{NAME}} 👋</h1>
    <p>You've been invited to watch {{PET}}. Tap below and this phone will stay signed in.</p>
    <form method="post"><button type="submit">Join {{APP_NAME}}</button></form>
  </div>
  <div class="expired">
    <h1>Link expired</h1>
    <p>Invite links work once, for 24 hours. Ask for a new one.</p>
  </div>
</div>
</body>
</html>
