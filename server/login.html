<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#F6F8FF">
<link rel="stylesheet" href="/themes.css">
<script>/* the chosen theme before first paint; theme-app.js resolves the rest */try{var p=JSON.parse(localStorage.getItem("openpetcam.theme.preferences.v1")||"{}"),d=document.documentElement;d.setAttribute("data-opc-theme",{cobalt:1,golden:1,meadow:1}[p.theme]?p.theme:"cobalt");if(p.appearance==="light"||p.appearance==="dark")d.setAttribute("data-opc-mode",p.appearance)}catch(e){}</script>
<script type="module" src="/theme-app.js"></script>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="icon" href="/favicon.png" sizes="96x96" type="image/png">
<meta name="apple-mobile-web-app-title" content="{{APP_NAME}}">
<title>{{APP_NAME}}</title>
<style>
  :root { --bg:var(--opc-canvas); --card:var(--opc-surface); --card2:var(--opc-surface-raised); --line:var(--opc-border-subtle); --control:var(--opc-control-border); --text:var(--opc-text-primary); --muted:var(--opc-text-secondary); --dim:var(--opc-text-muted); --accent:var(--opc-accent-fill); --on-accent:var(--opc-on-accent); --accent-fg:var(--opc-accent-foreground); --accent-subtle:var(--opc-accent-subtle); --ok:var(--opc-success); --warn:var(--opc-warning); --bad:var(--opc-error); --err:var(--opc-error); }
  * { box-sizing: border-box; }
  body { margin:0; min-height:100dvh; display:grid; place-items:center; background:var(--bg); color:var(--text);
         font:16px/1.4 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; padding:16px; }
  form { width:100%; max-width:360px; background:var(--card); border:1px solid var(--line); border-radius:22px; padding:28px 22px; }
  .logo { width:56px; height:56px; border-radius:14px; display:block; margin-bottom:14px; }
  h1 { margin:0 0 4px; font-size:24px; font-weight:700; }
  p { margin:0 0 20px; color:var(--muted); font-size:14px; }
  label { display:block; font-size:13px; color:var(--muted); margin:14px 0 6px; }
  input { width:100%; padding:14px; border-radius:12px; border:1px solid var(--control); background:var(--bg); color:var(--text); font-size:16px; }
  input:focus-visible { outline:3px solid var(--opc-focus-ring); outline-offset:2px; }
  button { margin-top:20px; width:100%; padding:15px; border:0; border-radius:14px; background:var(--accent); color:var(--on-accent); font-size:17px; font-weight:700; cursor:pointer; }
  .err { color:var(--err); font-size:14px; min-height:20px; margin-top:12px; }
  .fine { color:var(--muted); font-size:12px; margin-top:14px; }

  /* the mark for light surfaces, and the light-ringed one for dark (follows the theme's mode) */
  .logo.on-dark { display:none; }
  @media (prefers-color-scheme: dark) { :root:not([data-opc-mode]) .logo.on-light { display:none; } :root:not([data-opc-mode]) .logo.on-dark { display:block; } }
  :root[data-opc-mode="dark"] .logo.on-light { display:none; } :root[data-opc-mode="dark"] .logo.on-dark { display:block; }
</style>
</head>
<body>
<form method="post" action="/login">
  <img class="logo on-light" src="/logo-light.png" alt="OpenPetCam"><img class="logo on-dark" src="/logo.png" alt="OpenPetCam">
  <h1>{{APP_NAME}}</h1>
  <p>Log in once. This device stays signed in until you remove it.</p>
  <label for="device">This device</label>
  <input id="device" name="device" maxlength="40" placeholder="e.g. Alex's iPhone" autocomplete="off">
  <label for="password">Password</label>
  <input id="password" type="password" name="password" autocomplete="current-password" required>
  <button type="submit">Log in</button>
  <div class="err"><!--ERR--></div>
  <div class="fine">Signed-in devices are listed under Settings, where you can remove any of them.</div>
</form>
</body>
</html>
