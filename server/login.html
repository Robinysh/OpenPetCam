<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b0b0c">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="{{PET}}">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" type="image/png" href="/favicon.png">
<title>{{APP_NAME}}</title>
<style>
  :root { color-scheme: dark; --bg:#0b0b0c; --card:#161618; --line:#2a2a2e; --text:#f2f2f3; --muted:#9a9aa2; --accent:#ffd60a; --err:#ff6b6b; }
  * { box-sizing: border-box; }
  body { margin:0; min-height:100dvh; display:grid; place-items:center; background:var(--bg); color:var(--text);
         font:16px/1.4 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; padding:16px; }
  form { width:100%; max-width:360px; background:var(--card); border:1px solid var(--line); border-radius:22px; padding:28px 22px; }
  .logo { width:56px; height:56px; border-radius:14px; display:block; margin-bottom:14px; }
  h1 { margin:0 0 4px; font-size:24px; font-weight:700; }
  p { margin:0 0 20px; color:var(--muted); font-size:14px; }
  label { display:block; font-size:13px; color:var(--muted); margin:14px 0 6px; }
  input { width:100%; padding:14px; border-radius:12px; border:1px solid var(--line); background:#0f0f11; color:var(--text); font-size:16px; }
  input:focus { outline:2px solid #55555c; outline-offset:1px; }
  button { margin-top:20px; width:100%; padding:15px; border:0; border-radius:14px; background:var(--accent); color:#111; font-size:17px; font-weight:700; cursor:pointer; }
  .err { color:var(--err); font-size:14px; min-height:20px; margin-top:12px; }
  .fine { color:var(--muted); font-size:12px; margin-top:14px; }
</style>
</head>
<body>
<form method="post" action="/login">
  <img class="logo" src="/logo.png" alt="OpenPetCam">
  <h1>{{APP_NAME}}</h1>
  <p>Log in once. This device stays signed in until you remove it.</p>
  <label for="device">This device</label>
  <input id="device" name="device" maxlength="40" placeholder="e.g. Alex's iPhone" autocomplete="off">
  <label for="password">Password</label>
  <input id="password" type="password" name="password" autocomplete="current-password" required>
  <button type="submit">Log in</button>
  <div class="err"><!--ERR--></div>
  <div class="fine">Signed-in devices are listed under Settings, where you can remove any of them.</div>
</form>
</body>
</html>
