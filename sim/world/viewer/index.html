<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Room World Model</title>
<style>
:root {
  --bg: #0e1116; --panel: rgba(22,26,33,.92); --line: #2a313c; --ink: #e8ebf0; --muted: #98a2b3; --faint: #5d6675;
  --accent: #6aa7ff; --visible: #e9c46a; --infrared: #d7d7d7; --acoustic: #5fd3b8; --radio: #c49bff; --dog: #ff8a5b;
  --pred: #ff5d73;
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; background: var(--bg); color: var(--ink); font: 13px/1.4 -apple-system, "Segoe UI", Roboto, sans-serif; overflow: hidden; }
#view { position: fixed; inset: 0 0 150px 0; }
canvas.gl { display: block; width: 100%; height: 100%; }
.panel { position: fixed; background: var(--panel); border: 1px solid var(--line); border-radius: 10px; backdrop-filter: blur(6px); }
#layers { left: 12px; top: 12px; width: 272px; max-height: calc(100% - 236px); overflow: auto; padding: 10px 0; }
#layers h1 { font-size: 13px; margin: 0 14px 2px; }
#layers .sub { color: var(--muted); margin: 0 14px 8px; font-size: 12px; }
.band { border-top: 1px solid var(--line); padding: 8px 14px; }
.band h2 { font-size: 11px; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); margin: 0 0 4px; display: flex; gap: 6px; align-items: center; }
.dot { width: 8px; height: 8px; border-radius: 50%; display: inline-block; }
.row { display: flex; align-items: flex-start; gap: 8px; padding: 4px 0; cursor: pointer; }
.row input { margin: 2px 0 0; accent-color: var(--accent); }
.row .t { flex: 1; }
.row .m { color: var(--faint); font-size: 11px; display: none; margin-top: 2px; }
.row:hover .m, .row.open .m { display: block; }
#modes { left: 50%; top: 12px; transform: translateX(-50%); display: flex; padding: 3px; gap: 2px; }
#modes button { background: none; border: 0; color: var(--muted); padding: 6px 12px; border-radius: 7px; font: inherit; cursor: pointer; }
#modes button.on { background: #2b3340; color: var(--ink); }
#info { right: 12px; top: 12px; width: 330px; max-height: calc(100% - 380px); overflow: auto; padding: 12px 14px; }
#info h3 { margin: 0 0 6px; font-size: 13px; }
#info p { margin: 4px 0 8px; color: var(--muted); font-size: 12px; }
#info table { width: 100%; border-collapse: collapse; font-size: 12px; }
#info td, #info th { padding: 3px 4px; border-bottom: 1px solid var(--line); text-align: left; }
#info th { color: var(--muted); font-weight: 500; }
#inset { right: 12px; bottom: 162px; width: 260px; padding: 6px; }
#inset img { width: 100%; display: block; border-radius: 6px; background: #000; aspect-ratio: 16/9; object-fit: cover; }
#inset .cap { color: var(--muted); font-size: 11px; padding: 4px 2px 0; }
#timeline { left: 0; right: 0; bottom: 0; height: 150px; border-radius: 0; border-width: 1px 0 0; padding: 6px 12px 8px; display: grid; grid-template-columns: 110px 1fr; grid-template-rows: 26px 1fr; gap: 4px 10px; }
#tl-head { grid-column: 1 / 3; display: flex; align-items: center; gap: 10px; }
#tl-head button { background: #2b3340; border: 0; color: var(--ink); border-radius: 6px; padding: 4px 10px; cursor: pointer; font: inherit; }
#tl-head select { background: #2b3340; color: var(--ink); border: 0; border-radius: 6px; padding: 4px; font: inherit; }
#clock { font-variant-numeric: tabular-nums; font-weight: 600; }
#tl-labels { color: var(--muted); font-size: 11px; display: grid; grid-auto-rows: 1fr; align-items: center; }
#tl-wrap { position: relative; min-height: 0; } #tl-canvas { position: absolute; inset: 0; width: 100%; height: 100%; cursor: ew-resize; }
.hint { position: fixed; left: 50%; bottom: 162px; transform: translateX(-50%); color: var(--faint); font-size: 11px; pointer-events: none; }
#tip { position: fixed; pointer-events: none; background: #0b0d11; border: 1px solid var(--line); padding: 4px 8px; border-radius: 6px; font-size: 12px; display: none; }
@media (max-width: 720px) { #info, #inset { display: none; } #layers { width: calc(100% - 24px); max-height: 40%; } #modes { top: auto; bottom: 162px; } }
</style>
<script type="importmap">{"imports": {"three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js", "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"}}</script>
</head>
<body>
<div id="view"></div>
<div id="layers" class="panel"><h1>Room world model</h1><div class="sub" id="subtitle">loading…</div><div id="bands"></div></div>
<div id="modes" class="panel"><button data-m="orbit" class="on">Measured</button><button data-m="doll">Planes</button><button data-m="eye">Camera eye</button><button data-m="plan">Floor plan</button>
  <select id="colourby" title="colour the room by" style="background:#2b3340;color:var(--ink);border:0;border-radius:7px;padding:5px 8px;font:inherit;margin-left:6px"></select></div>
<div id="info" class="panel"></div>
<div id="inset" class="panel"><img id="frame" alt="snapshot at the playhead"><div class="cap" id="framecap"></div></div>
<div class="hint">drag to orbit · scroll to zoom · drag the timeline to move through time</div>
<div id="timeline" class="panel">
  <div id="tl-head"><button id="play">Play</button><select id="speed"><option value="600">10 min/s</option><option value="3600" selected>1 h/s</option><option value="21600">6 h/s</option></select><select id="heatwin" title="heatmap window"><option value="0">heat: all time</option><option value="86400">heat: last 24 h</option><option value="21600">heat: last 6 h</option><option value="3600">heat: last hour</option></select><span id="clock"></span><span style="color:var(--muted)" id="tlnote"></span></div>
  <div id="tl-labels"><div>Pictures</div><div>Dog seen</div><div>Sound level</div><div>WiFi signal</div></div>
  <div id="tl-wrap"><canvas id="tl-canvas"></canvas></div>
</div>
<div id="heatbox" class="panel" style="left:12px;bottom:162px;padding:8px 10px;font-size:11px;color:var(--muted)"><div style="display:flex;align-items:center;gap:6px"><span>less</span><span style="width:120px;height:8px;border-radius:4px;background:linear-gradient(90deg,rgb(74,30,18),rgb(196,72,38),rgb(255,138,91),rgb(255,232,214))"></span><span>more time</span></div><div id="heatleg" style="margin-top:4px"></div></div>
<div id="tip"></div>
<script type="module">
import * as THREE from "three";
import { OrbitControls } from "three/addons/controls/OrbitControls.js";

export function qualifyInfraredLayer(layer) {
  if (layer.id === "infrared.nir_excess") return { ...layer,
    title: "Filter response (qualitative)",
    method: "Qualitative image change between IR-cut states; exposure, processing and spectrum can differ. This is not a material identity or reflectivity measurement.",
    band: { ...layer.band, note: "Filter-state comparison; reflected light, not temperature." } };
  if (layer.id === "infrared.led" && layer.data?.schema_version !== 2) return { ...layer,
    title: "LED brightness change (qualitative)",
    method: "Legacy JPEG difference without verified fixed exposure, gain, processing or camera response. This is not a reflectivity measurement.",
    band: { ...layer.band, note: "Uncontrolled reflected-light observation, not thermal imaging." } };
  return layer;
}

const M = await (await fetch("manifest.json")).json();
const L = Object.fromEntries(M.layers.map(l => [l.id, qualifyInfraredLayer(l)]));
const css = n => getComputedStyle(document.documentElement).getPropertyValue(n).trim();
const H = M.room.floor_height_m, CEIL = M.room.ceiling_m;

// ---------- camera model (same as sim/world/camera.py) ----------
const C = M.camera;
function Rm(pan, tilt, offA = 0, offB = 0) {
  const yaw = (1850 - pan) * C.deg_per_step_pan * Math.PI / 180, pit = -(tilt - C.level_tilt) * C.deg_per_step_tilt * Math.PI / 180, r = C.roll_deg * Math.PI / 180;
  const ry = new THREE.Matrix3().set(Math.cos(yaw), 0, Math.sin(yaw), 0, 1, 0, -Math.sin(yaw), 0, Math.cos(yaw));
  const rx = new THREE.Matrix3().set(1, 0, 0, 0, Math.cos(pit), -Math.sin(pit), 0, Math.sin(pit), Math.cos(pit));
  const rz = new THREE.Matrix3().set(Math.cos(r), -Math.sin(r), 0, Math.sin(r), Math.cos(r), 0, 0, 0, 1);
  const m = ry.multiply(rx).multiply(rz);
  if (offA || offB) {                                         // registration: pitch down offA, yaw right offB (camera frame)
    const a = offA * Math.PI / 180, b = offB * Math.PI / 180;
    const oy = new THREE.Matrix3().set(Math.cos(b), 0, Math.sin(b), 0, 1, 0, -Math.sin(b), 0, Math.cos(b));
    const ox = new THREE.Matrix3().set(1, 0, 0, 0, Math.cos(a), -Math.sin(a), 0, Math.sin(a), Math.cos(a));
    m.multiply(oy).multiply(ox);
  }
  return m;
}
const headDir = (pan, tilt) => new THREE.Vector3(0, 0, 1).applyMatrix3(Rm(pan, tilt));

// ---------- renderer ----------
const view = document.getElementById("view");
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.domElement.className = "gl";
view.appendChild(renderer.domElement);
const scene = new THREE.Scene();
scene.background = new THREE.Color(css("--bg"));
// The model's frame (x right, y up, z forward, as camera.py) is left-handed; three.js is right-handed. Everything in
// model coordinates goes into this mirrored group, and the shader un-mirrors its lookup direction.
const world = new THREE.Group(); world.scale.x = -1; scene.add(world);
const cam3 = new THREE.PerspectiveCamera(60, 1, 0.02, 200);
cam3.position.set(-5.5, 4.5, -4.5);
const controls = new OrbitControls(cam3, renderer.domElement);
controls.target.set(0, -0.4, 1.2);
controls.enableDamping = true;

// ---------- projective panorama material: every surface shows what the lens saw in its direction ----------
const loader = new THREE.TextureLoader();
const tex = src => { const t = loader.load(src); t.colorSpace = THREE.SRGBColorSpace; return t; };
const blank = new THREE.DataTexture(new Uint8Array([0, 0, 0, 255]), 1, 1); blank.needsUpdate = true;
const U = {
  pano: { value: blank }, panoOn: { value: 1 }, over: { value: blank }, overOn: { value: 0 }, frame: { value: blank }, frameOn: { value: 0 },
  frameRt: { value: new THREE.Matrix3() }, f: { value: C.focal_px }, k1: { value: C.k1 }, k2: { value: C.k2 },
  base: { value: new THREE.Color("#3a414d") }, frameGain: { value: 1.0 },
  clay: { value: new THREE.Color("#c8c6c1") }, cut: { value: 0 }, lightDir: { value: new THREE.Vector3(0.45, 0.8, 0.35).normalize() }
};
const vert = `varying vec3 wp; void main(){ vec4 w = modelMatrix * vec4(position,1.); wp = w.xyz; gl_Position = projectionMatrix * viewMatrix * w; }`;
const frag = `
uniform sampler2D pano, frame, over; uniform float panoOn, overOn, frameOn, f, k1, k2, frameGain, cut; uniform mat3 frameRt; uniform vec3 base, clay, lightDir;
varying vec3 wp;
void main(){
  vec3 d = normalize(vec3(-wp.x, wp.y, wp.z));
  vec2 uv = vec2(atan(d.x, d.z) / 6.2831853 + 0.5, 0.5 + asin(clamp(d.y,-1.,1.)) / 3.1415927);
  vec3 p = texture2D(pano, uv).rgb;
  float seen = step(0.02, p.r + p.g + p.b) * panoOn;
  vec3 fn = normalize(cross(dFdx(wp), dFdy(wp)));
  float lensSide = dot(fn, normalize(-wp));
  // dollhouse cut-away (as Matterport's): a surface the viewer sees from its BACK (the lens saw the other side) is
  // left out, so the walls and the counter underside between the viewer and the room open up instead of hiding it
  if (cut > 0.5 && lensSide < -0.02) discard;
  // soft light so the shape reads: half-Lambert from one direction over a high ambient
  float sh = 0.62 + 0.38 * (0.5 + 0.5 * dot(fn, normalize(vec3(-lightDir.x, lightDir.y, lightDir.z))));
  // never photographed, or seen only edge-on: light neutral clay (honestly untextured), not a dark slab
  vec3 col = mix(clay * sh, p * mix(1.0, sh, 0.35), seen);
  if (lensSide < 0.12) col = clay * sh * 0.92;
  if (overOn > 0.5) { vec3 o = texture2D(over, uv).rgb; float so = step(0.02, o.r + o.g + o.b); col = mix(col, o, so * 0.85); }
  if (frameOn > 0.5) {
    vec3 c = frameRt * d;
    if (c.z > 0.15) {
      float x = c.x / c.z, y = c.y / c.z, r2 = x*x + y*y, k = 1. + k1*r2 + k2*r2*r2;
      vec2 q = vec2((x*k*f + 960.) / 1920., 1. - (540. - y*k*f) / 1080.);
      if (q.x > 0. && q.x < 1. && q.y > 0. && q.y < 1. && r2 < 0.45) {
        col = texture2D(frame, q).rgb * frameGain;
        col = mix(col, vec3(1.), 0.04);
      }
    }
  }
  gl_FragColor = vec4(col, 1.);
  #include <colorspace_fragment>
}`;
let dollhouse = false;   // the Planes mode: the fitted planes and boxes (a simplification); Measured (default) is the fused surface
const outlineOnly = new THREE.MeshBasicMaterial({ visible: false });   // the countertop in the dollhouse: edges only
const panoMat = new THREE.ShaderMaterial({ uniforms: U, vertexShader: vert, fragmentShader: frag, side: THREE.DoubleSide });
// the fused surface and the walls open up from outside (cut-away); object boxes and the floor keep every face
const fusedMat = new THREE.ShaderMaterial({ uniforms: { ...U, cut: { value: 1 } }, vertexShader: vert, fragmentShader: frag, side: THREE.DoubleSide });
const wallMat = new THREE.ShaderMaterial({ uniforms: { ...U, cut: { value: 1 } }, vertexShader: vert, fragmentShader: frag, side: THREE.DoubleSide });

// ---------- the room ----------
const room = new THREE.Group(); world.add(room);
// floor: a fan from the lens out to the nearest wall at each azimuth; gaps up to 25 deg are bridged, wider ones
// (no wall modelled) end at 1.2 m and are drawn plain, so nothing reads as measured that was not
const OL = M.room.outline;
const rad = OL.map(o => o[1]);
for (let i = 0; i < rad.length; i++) if (rad[i] == null) {
  let a = i, b = i; while (rad[(a - 1 + rad.length) % rad.length] == null && i - a < 30) a--; while (rad[(b + 1) % rad.length] == null && b - i < 30) b++;
  const ra = rad[(a - 1 + rad.length) % rad.length], rb = rad[(b + 1) % rad.length];
  OL[i].gap = (b - a + 1) > 25 || ra == null || rb == null;
  OL[i].r = OL[i].gap ? 1.2 : ra + (rb - ra) * (i - a + 1) / (b - a + 2);
} else OL[i].r = rad[i];
function fan(sel) {
  const pos = [];
  for (let i = 0; i < OL.length; i++) {
    const j = (i + 1) % OL.length; if (!sel(OL[i]) || !sel(OL[j])) continue;
    const p = o => [Math.sin(o[0] * Math.PI / 180) * o.r, -H, Math.cos(o[0] * Math.PI / 180) * o.r];
    pos.push(0, -H, 0, ...p(OL[j]), ...p(OL[i]));
  }
  const g = new THREE.BufferGeometry(); g.setAttribute("position", new THREE.Float32BufferAttribute(pos, 3)); g.computeVertexNormals(); return g;
}
const floor = new THREE.Mesh(fan(o => !o.gap), panoMat); floor.userData = { label: "floor" }; room.add(floor);
const floorGap = new THREE.Mesh(fan(o => o.gap), new THREE.MeshBasicMaterial({ color: 0x232932, side: THREE.DoubleSide }));
floorGap.userData = { label: "floor, no wall modelled in this direction" }; room.add(floorGap);
const outlinePts = OL.filter(o => !o.gap).map(o => new THREE.Vector3(Math.sin(o[0] * Math.PI / 180) * o.r, -H + 0.004, Math.cos(o[0] * Math.PI / 180) * o.r));
room.add(new THREE.LineLoop(new THREE.BufferGeometry().setFromPoints(outlinePts), new THREE.LineBasicMaterial({ color: 0x8a96a8 })));
const wallMeshes = [];
const COUNTER = H + (M.room.overhead_m || 0);       // floor to the countertop the camera hangs under
for (const w of M.room.walls) {
  const [ax, az] = w.a, [bx, bz] = w.b, len = Math.hypot(bx - ax, bz - az);
  // a face within 0.6 m of the lens is a cabinet under the counter, so only counter-high; others reach the ceiling
  const mid = [(ax + bx) / 2, (az + bz) / 2], hgt = Math.hypot(...mid) < 0.6 ? COUNTER : CEIL;
  const g = new THREE.PlaneGeometry(len, hgt, 8, 8);
  const m = new THREE.Mesh(g, wallMat);
  m.position.set(mid[0], -H + hgt / 2, mid[1]);
  m.rotation.y = Math.atan2(-(bz - az), bx - ax);
  m.userData = w; room.add(m); wallMeshes.push(m);
  const edge = new THREE.LineSegments(new THREE.EdgesGeometry(g), new THREE.LineBasicMaterial({ color: 0x8a96a8, transparent: true, opacity: .35 }));
  edge.position.copy(m.position); edge.rotation.copy(m.rotation); room.add(edge);
  // wall-top cap (as a dollhouse shows the cut walls): a thin light slab along the top edge, shown only while its
  // wall faces the viewer (a cut-away wall leaves no floating cap)
  const cap = new THREE.Mesh(new THREE.BoxGeometry(len, 0.03, 0.07), new THREE.MeshBasicMaterial({ color: 0xe9e7e2 }));
  cap.position.set(mid[0], -H + hgt, mid[1]); cap.rotation.y = m.rotation.y; room.add(cap);
  const nx = -(bz - az) / len, nz = (bx - ax) / len, toLens = -(mid[0] * nx + mid[1] * nz) > 0 ? 1 : -1;
  m.userData.side = { mid, n: [nx * toLens, nz * toLens], cap, edge };
}
const camLocal = new THREE.Vector3();
function updateCaps() {
  // which side of each wall the viewer is on (model coordinates): the lens side keeps wall, cap and edge
  camLocal.copy(cam3.position); world.worldToLocal(camLocal);
  for (const m of wallMeshes) {
    const { mid, n, cap, edge } = m.userData.side;
    const front = (camLocal.x - mid[0]) * n[0] + (camLocal.z - mid[1]) * n[1] > 0;
    cap.visible = front; edge.visible = front || !dollhouse;
  }
}
let overhang = null;
if (M.room.overhead_m) {
  const o = new THREE.Mesh(new THREE.PlaneGeometry(1.6, 1.0), panoMat);
  o.rotation.x = Math.PI / 2; o.position.set(0, M.room.overhead_m, 0); o.userData = { label: "countertop overhang (from the sound echo)" };
  room.add(o); overhang = o;
  const oe = new THREE.LineSegments(new THREE.EdgesGeometry(o.geometry), new THREE.LineBasicMaterial({ color: 0xe9e7e2, transparent: true, opacity: .5 }));
  o.add(oe);
}
const sky = new THREE.Mesh(new THREE.SphereGeometry(14, 64, 32), panoMat); world.add(sky); sky.visible = false;
// the camera itself
const camMark = new THREE.Group(); world.add(camMark);
camMark.add(new THREE.Mesh(new THREE.SphereGeometry(0.05, 16, 12), new THREE.MeshBasicMaterial({ color: css("--accent") })));
const coneGeo = new THREE.ConeGeometry(0.16, 0.42, 4, 1, true); coneGeo.rotateX(-Math.PI / 2); coneGeo.translate(0, 0, 0.21);
const cone = new THREE.Mesh(coneGeo, new THREE.MeshBasicMaterial({ color: css("--accent"), wireframe: true }));
camMark.add(cone);
const grid = new THREE.PolarGridHelper(7, 12, 7, 64, 0x2a313c, 0x2a313c); grid.position.y = -H + 0.002; world.add(grid);

// ---------- sound: range shells within each recording's head beam, and predicted surfaces ----------
const sound = new THREE.Group(); world.add(sound);
const ac = css("--acoustic"), pc = css("--pred");
for (const it of (L["acoustic.echoes"]?.data.items || [])) {
  const g = new THREE.Group(); g.userData = it;
  const d = headDir(it.pan, it.tilt);
  const q = new THREE.Quaternion().setFromUnitVectors(new THREE.Vector3(0, 1, 0), d);
  for (const [r, s] of it.echoes) {
    const cap = new THREE.Mesh(new THREE.SphereGeometry(r, 32, 8, 0, Math.PI * 2, 0, 0.55),
      new THREE.MeshBasicMaterial({ color: ac, transparent: true, opacity: 0.12 + 0.6 * s, side: THREE.DoubleSide, depthWrite: false }));
    cap.quaternion.copy(q); g.add(cap);
  }
  const beam = new THREE.Line(new THREE.BufferGeometry().setFromPoints([new THREE.Vector3(), d.clone().multiplyScalar(2)]),
    new THREE.LineDashedMaterial({ color: ac, dashSize: .05, gapSize: .05 }));
  beam.computeLineDistances(); g.add(beam);
  sound.add(g);
}
sound.visible = false;

// ---------- dog on the floor ----------
const dogRows = L["presence.dog"]?.data.rows || [];
const dogGeo = new THREE.BufferGeometry();
dogGeo.setAttribute("position", new THREE.Float32BufferAttribute(dogRows.flatMap(r => [r[1], -H + 0.01, r[2]]), 3));
const dogCol = new Float32Array(dogRows.length * 3); dogGeo.setAttribute("color", new THREE.BufferAttribute(dogCol, 3));
const dogPts = new THREE.Points(dogGeo, new THREE.PointsMaterial({ size: 0.06, vertexColors: true, transparent: true, opacity: 0.9, depthWrite: false }));
world.add(dogPts);

// ---------- fused surface: one range per direction, meshed, torn at depth jumps, textured from the lens ----------
const fusedMeta = L["fused.surface"]?.data;
const fused = new THREE.Mesh(new THREE.BufferGeometry(), fusedMat); world.add(fused); fused.visible = false;
const furniture = new THREE.Mesh(new THREE.BufferGeometry(), fusedMat); world.add(furniture); furniture.visible = false;
furniture.userData = { label: "furniture (fused surface, object class)" };
if (fusedMeta) {
  const buf = await (await fetch(fusedMeta.filled_file || fusedMeta.file)).arrayBuffer();   // blind spots filled by sound (blindfill.py)
  const R = new Float32Array(buf), FW = fusedMeta.width, FH = fusedMeta.height;
  const pos = new Float32Array(FW * FH * 3);
  for (let j = 0; j < FH; j++) for (let i = 0; i < FW; i++) {
    const az = ((i + 0.5) / FW * 360 - 180) * Math.PI / 180, el = (90 - (j + 0.5) / FH * 180) * Math.PI / 180, r = R[j * FW + i], k = (j * FW + i) * 3;
    pos[k] = Math.cos(el) * Math.sin(az) * r; pos[k + 1] = Math.sin(el) * r; pos[k + 2] = Math.cos(el) * Math.cos(az) * r;
  }
  const idx = [];
  const va = new THREE.Vector3(), vb = new THREE.Vector3(), vc = new THREE.Vector3(), e1 = new THREE.Vector3(), e2 = new THREE.Vector3();
  const ok = (a, b, c) => {
    const ra = R[a], rb = R[b], rc = R[c]; if (!ra || !rb || !rc) return false;
    const mx = Math.max(ra, rb, rc), mn = Math.min(ra, rb, rc); if (!(mx / mn < 1.18 || mx - mn < 0.05)) return false;
    va.fromArray(pos, a * 3); vb.fromArray(pos, b * 3); vc.fromArray(pos, c * 3);
    const n = e1.subVectors(vb, va).cross(e2.subVectors(vc, va)); const len = n.length(); if (!len) return false;
    const d = va.clone().add(vb).add(vc).normalize();
    return Math.abs(n.dot(d)) / len > 0.12;                 // facing the lens by more than ~7 deg: not a sliver
  };
  // two passes: keep the triangles that pass, then trim the ragged rim (a triangle survives only if each of its
  // vertices is used by at least 4 good triangles), which removes the one-pixel spikes and fringes at torn edges
  const tris = [], use = new Uint8Array(FW * FH);

  const ok = light.map((x, k) => [k, x]).filter(([, x]) => Number.isFinite(x));
  g.strokeStyle = css("--visible"); g.lineWidth = 3; g.beginPath();
  ok.forEach(([k, x], n) => { const X = 20 + k / 23 * 560, Y = 140 - x / 255 * 120; n ? g.lineTo(X, Y) : g.moveTo(X, Y); g.fillRect(X - 3, Y - 3, 6, 6); }); g.stroke();
  for (const hh of [0, 6, 12, 18, 23]) g.fillText(hh + "h", 20 + hh / 23 * 560 - 8, 158);
});

// ---------- info panel ----------
const info = document.getElementById("info");
function showInfo(id) {
  const l = L[id];
  if (id === "acoustic.echoes" || id === "acoustic.coda") return soundInfo(id);
  if (id === "radio.scan") {
    const n = l.data.networks;
    info.innerHTML = `<h3>${l.title}</h3><p>${l.method}</p><table><tr><th>band</th><th>channel</th><th>signal</th><th></th></tr>` +
      n.map(x => `<tr><td>${x.band}</td><td>${x.channel.split(" ")[0]}</td><td>${x.signal_dbm ?? "–"} dBm</td><td>${x.home ? "this network" : ""}</td></tr>`).join("") + "</table>";
    return;
  }
  if (id === "visible.da3") {
    const e = l.data.eval;
    info.innerHTML = `<h3>${l.title}</h3><p>${l.method}</p><p>Floor flat to ${(e.floor_flatness_m * 100).toFixed(0)} cm (median). Model units × ${e.scale_to_metres.toFixed(2)} = metres, from the sound floor echo.</p><table><tr><th>surface</th><th>placed by eye</th><th>DA3</th></tr>` +
      e.wall_checks.map(c => `<tr><td>${c.label}</td><td>${c.picked_m.toFixed(2)} m</td><td>${c.da3_m.toFixed(2)} m</td></tr>`).join("") + "</table>";
    return;
  }
  if (id === "acoustic.spectrum") { info.innerHTML = `<h3>${l.title}</h3><p>${l.method}</p><canvas id="spec" width="600" height="300" style="width:100%"></canvas>`; return lineChart("spec", l.data.f.map(x => x / 1000), l.data.db, "kHz", "dB", css("--acoustic")); }
  if (id === "room") {
    const r = M.room;
    info.innerHTML = `<h3>Room geometry</h3><p>Floor ${r.floor_height_m} m below the lens (${r.provenance.floor_height}). Countertop overhang ${r.overhead_m} m above (${r.provenance.overhead}). Ceiling ${r.ceiling_m} m: ${r.provenance.ceiling}.</p><p>${r.provenance.walls}</p><table><tr><th>surface</th><th>distance</th><th>fit</th></tr>` +
      r.walls.map(w => `<tr><td>${w.label}</td><td>${w.distance_m.toFixed(2)} m</td><td>±${w.fit_rms_m.toFixed(2)}</td></tr>`).join("") + "</table>";
    return;
  }
  if (!l) { info.innerHTML = `<h3>Backdrop sphere</h3><p>Directions no surface is modelled for, painted at 14 m so nothing the camera saw is hidden.</p>`; return; }
  info.innerHTML = `<h3>${l.title}</h3><p>${l.method}</p><p style="color:var(--faint)">Band: ${l.band.kind}, ${fmtWl(l.band.lo_m)}–${fmtWl(l.band.hi_m)}. ${l.band.note}</p>` +
    (l.type === "note" ? `<table>${Object.entries(l.data.z).map(([k, v]) => `<tr><td>${k}</td><td>z = ${v}</td></tr>`).join("")}</table>` : "");
}
const fmtWl = m => m < 1e-6 ? `${Math.round(m * 1e9)} nm` : m < 1 ? `${(m * 100).toFixed(1)} cm` : `${m.toFixed(1)} m`;
let soundSel = 0;
function soundInfo(id) {
  const items = L["acoustic.echoes"].data.items;
  if (id === "acoustic.coda") {
    const d = L["acoustic.coda"].data;
    info.innerHTML = `<h3>${L["acoustic.coda"].title}</h3><p>${L["acoustic.coda"].method}</p><table><tr><th></th>${d.names.map(n => `<th>${n.replace(".wav", "")}</th>`).join("")}</tr>` +
      d.corr.map((r, i) => `<tr><th>${d.names[i].replace(".wav", "")}</th>${r.map(v => `<td style="background:rgba(95,211,184,${v * 0.6})">${v.toFixed(2)}</td>`).join("")}</tr>`).join("") + "</table><p>ctl_0 and ctl_1 are the same pose a few seconds apart.</p>";
    return;
  }
  const it = items[soundSel];
  info.innerHTML = `<h3>Sound: echo profile</h3><p>${L["acoustic.echoes"].method}</p>
    <div style="display:flex;gap:4px;flex-wrap:wrap;margin-bottom:6px">${items.map((x, i) => `<button data-i="${i}" style="background:${i === soundSel ? "#2b3340" : "none"};color:var(--ink);border:1px solid var(--line);border-radius:6px;padding:2px 6px;cursor:pointer">${x.file.replace(".wav", "")} · az ${x.az}°</button>`).join("")}</div>
    <canvas id="echo" width="600" height="320" style="width:100%"></canvas>
    <p><span style="color:var(--acoustic)">━</span> measured (${it.sweeps} sweeps) &nbsp; <span style="color:var(--pred)">┃</span> room model, first-order specular</p>
    <table><tr><th>model surface</th><th>range</th><th>off head axis</th></tr>${it.predicted.map(p => `<tr><td>${p.label}</td><td>${p.range_m.toFixed(2)} m</td><td>${p.off_axis_deg}°</td></tr>`).join("")}</table>`;
  info.querySelectorAll("button[data-i]").forEach(b => b.onclick = () => { soundSel = +b.dataset.i; soundInfo("acoustic.echoes"); });
  lineChart("echo", it.range_m, it.envelope, "one-way range (m)", "echo strength", css("--acoustic"), it.predicted.filter(p => p.range_m < 3).map(p => p.range_m));
}
function lineChart(id, xs, ys, xl, yl, color, marks = []) {
  const c = document.getElementById(id), g = c.getContext("2d"), W = c.width, Hh = c.height, p = 36;
  const x0 = Math.min(...xs), x1 = Math.max(...xs), y0 = Math.min(...ys), y1 = Math.max(...ys);
  const X = x => p + (x - x0) / (x1 - x0) * (W - p - 10), Y = y => Hh - p + -(y - y0) / (y1 - y0 || 1) * (Hh - p - 10);
  g.clearRect(0, 0, W, Hh); g.strokeStyle = css("--line"); g.lineWidth = 1; g.fillStyle = css("--muted"); g.font = "20px sans-serif";
  for (let i = 0; i <= 4; i++) { const x = x0 + (x1 - x0) * i / 4; g.beginPath(); g.moveTo(X(x), 10); g.lineTo(X(x), Hh - p); g.stroke(); g.fillText(x.toFixed(x1 - x0 > 10 ? 0 : 1), X(x) - 10, Hh - 12); }
  g.fillText(xl, W / 2 - 60, Hh - 0.5 + 0);
  g.strokeStyle = pc; g.lineWidth = 2; for (const m of marks) { g.beginPath(); g.moveTo(X(m), 10); g.lineTo(X(m), Hh - p); g.stroke(); }
  g.strokeStyle = color; g.lineWidth = 2; g.beginPath(); xs.forEach((x, i) => i ? g.lineTo(X(x), Y(ys[i])) : g.moveTo(X(x), Y(ys[i]))); g.stroke();
}

// ---------- timeline ----------
const tl = document.getElementById("tl-canvas");
function drawTimeline() {
  const r = tl.getBoundingClientRect(), dpr = devicePixelRatio; tl.width = r.width * dpr; tl.height = r.height * dpr;
  const g = tl.getContext("2d"); g.scale(dpr, dpr); const W = r.width, Hh = r.height, row = Hh / 4;
  const X = t => (t - tMin) / (tMax - tMin) * W;
  g.clearRect(0, 0, W, Hh);
  // day bands
  const d0 = new Date(tMin * 1000); d0.setHours(0, 0, 0, 0);
  for (let t = d0.getTime() / 1000; t < tMax; t += 86400) {
    g.fillStyle = "rgba(255,255,255,0.025)"; g.fillRect(X(t + 6 * 3600), 0, X(t + 20 * 3600) - X(t + 6 * 3600), Hh);
    g.fillStyle = css("--faint"); g.font = "10px sans-serif"; g.fillText(new Date(t * 1000).toLocaleDateString([], { weekday: "short", day: "numeric" }), X(t) + 3, Hh - 3);
  }
  for (const f of frames) { g.fillStyle = f[6] === "infrared" ? css("--infrared") : css("--visible"); g.globalAlpha = .5; g.fillRect(X(f[0]), 4, 1, row - 8); }
  g.globalAlpha = .35; g.fillStyle = css("--dog"); for (let i = 0; i < dogRows.length; i += 3) g.fillRect(X(dogRows[i][0]), row + 4, 1, row - 8);
  g.globalAlpha = 1;
  const spark = (d, k, color) => { if (!d || !d.t.length) return; const lo = Math.min(...d.v), hi = Math.max(...d.v); g.strokeStyle = color; g.lineWidth = 1; g.beginPath();
    d.t.forEach((t, i) => { const y = k * row + row - 4 - (d.v[i] - lo) / (hi - lo || 1) * (row - 8); i ? g.lineTo(X(t), y) : g.moveTo(X(t), y); }); g.stroke(); };
  spark(noise, 2, css("--acoustic")); spark(rssi, 3, css("--radio"));
  if (rssi && rssi.t.length && X(rssi.t.at(-1)) - X(rssi.t[0]) < 6) { g.fillStyle = css("--radio"); g.fillText("recording now (last " + Math.round((rssi.t.at(-1) - rssi.t[0]) / 60) + " min)", Math.max(0, X(rssi.t[0]) - 150), 3 * row + row / 2 + 3); }
  g.strokeStyle = css("--accent"); g.lineWidth = 2; g.beginPath(); g.moveTo(X(T), 0); g.lineTo(X(T), Hh); g.stroke();
}
let dragging = false;
const seek = e => { const r = tl.getBoundingClientRect(); T = tMin + Math.min(1, Math.max(0, (e.clientX - r.left) / r.width)) * (tMax - tMin); apply(); };
tl.addEventListener("pointerdown", e => { dragging = true; tl.setPointerCapture(e.pointerId); seek(e); });
tl.addEventListener("pointermove", e => dragging && seek(e));
tl.addEventListener("pointerup", () => dragging = false);
let playing = false, last = 0;
document.getElementById("heatwin").onchange = e => { heatWindow = +e.target.value; heatDirty = true; apply(); };
document.getElementById("play").onclick = e => { playing = !playing; e.target.textContent = playing ? "Pause" : "Play"; if (T >= tMax) T = tMin; };


// ---------- view modes ----------
let mode = "orbit";
document.querySelectorAll("#modes button").forEach(b => b.onclick = () => {
  document.querySelectorAll("#modes button").forEach(x => x.classList.toggle("on", x === b)); mode = b.dataset.m;
  dollhouse = mode === "doll"; heatDirty = true;
  if (mode === "orbit" || mode === "doll") { cam3.position.set(-5.5, 4.5, -4.5); controls.target.set(0, -0.4, 1.2); controls.enableRotate = true; }
  if (mode === "plan") { cam3.position.set(0.01, 11, 1.2); controls.target.set(0, -H, 1.2); controls.enableRotate = false; }
  if (mode === "eye") { const f = near(frames, T); const d = f ? headDir(f[1], f[2]) : new THREE.Vector3(0, 0, 1); d.x = -d.x; cam3.position.set(0, 0, 0).addScaledVector(d, -0.001); controls.target.copy(d.clone().multiplyScalar(0.01)); controls.enableRotate = true; }
  apply();
});

// hover: name the surface under the pointer
const ray = new THREE.Raycaster(), tip = document.getElementById("tip");
renderer.domElement.addEventListener("pointermove", e => {
  const r = renderer.domElement.getBoundingClientRect();
  ray.setFromCamera(new THREE.Vector2((e.clientX - r.left) / r.width * 2 - 1, -(e.clientY - r.top) / r.height * 2 + 1), cam3);
  const hit = ray.intersectObjects(fused.visible ? [fused, ...objMeshes] : [...wallMeshes, floor, floorGap], false)[0];
  if (!hit) return tip.style.display = "none";
  const p = hit.point, d = Math.hypot(p.x, p.y, p.z);
  tip.style.display = "block"; tip.style.left = e.clientX + 12 + "px"; tip.style.top = e.clientY + 12 + "px";
  tip.textContent = `${hit.object.userData.label || "surface"} · ${d.toFixed(2)} m from the lens${hit.object.userData.source ? " · " + hit.object.userData.source : ""}`;
});

function resize() { const w = view.clientWidth, h = view.clientHeight; renderer.setSize(w, h, false); cam3.aspect = w / h; cam3.updateProjectionMatrix(); drawTimeline(); }
addEventListener("resize", resize); resize();
showInfo("acoustic.echoes"); apply();
renderer.setAnimationLoop(now => {
  if (playing) { T += (now - last) / 1000 * +document.getElementById("speed").value; if (T > tMax) { T = tMax; playing = false; document.getElementById("play").textContent = "Play"; } apply(); }
  last = now; controls.update(); updateCaps(); renderer.render(scene, cam3);
});
window.__ready = true;
window.__view = { cam3, controls, THREE, setLayer: (k, v) => { S[k] = v; apply(); } };   // for scripted checks
</script>
