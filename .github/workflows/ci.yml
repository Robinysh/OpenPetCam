name: ci
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pyflakes==3.2.0 numpy==2.1.3 pillow==11.0.0
      - name: No undefined names or unused imports
        run: python -m pyflakes server tools tests sim
      - name: Shell scripts parse
        run: for f in deploy.sh server/*.sh tools/*.sh; do bash -n "$f"; done
      - name: Nothing private is committed
        run: tools/check_public.sh --all
      - name: Tests that need no camera or server
        env:
          PETCAM_SITE_ENV: config/site.env.example
        run: |
          for t in tracker events presence stall disconnect pill search_here_first update pet_name theme search_evidence follow search_cancel spot_highlight talk_button policy fast_mode; do
            echo "== $t"; timeout 300 python tests/server/${t}_test.py
          done
      - name: The Follow simulator holds to the measured hardware and its own physics
        run: timeout 600 python tests/sim/sim_test.py && timeout 300 python tests/sim/sysid_recovery_test.py
