name: ci
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pyflakes==3.2.0 numpy==2.1.3 pillow==11.0.0 scipy==1.14.1 opencv-python-headless==4.10.0.84
      - name: No undefined names or unused imports
        run: python -m pyflakes server tools tests sim
      - name: Shell scripts parse
        run: for f in deploy.sh server/*.sh tools/*.sh; do bash -n "$f"; done
      - name: Nothing private is committed
        run: tools/check_public.sh --all
      - name: Offline tests (server + simulator), the same gate the release workflow runs
        run: tools/run_tests.sh
